name: WATCHFIRST Android
on:
  workflow_dispatch:
  push:
    branches: [main, splash-watchfirst]
    paths-ignore:
      - '**.md'
concurrency:
  group: watchfirst-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Local configuration (no secrets written to disk beyond this file)
        env:
          SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          NUVIO_ANDROID_DISTRIBUTION=full
          NUVIO_SUPABASE_URL=$SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          NUVIO_SUPABASE_FALLBACK_URL=$SUPABASE_FALLBACK_URL
          TMDB_API_KEY=$TMDB_API_KEY
          EOF

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          ORG_GRADLE_PROJECT_nuvio.app.versionName: ''
          RELEASE_KEYSTORE: ${{ steps.keystore.outputs.available == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.available }}" = "true" ]; then
            TASK=":androidApp:assembleFullRelease"
          else
            TASK=":androidApp:assembleFullDebug"
          fi
          ./gradlew $TASK --no-daemon --stacktrace

      - name: Collect APKs and checksums
        id: collect
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          find androidApp/build/outputs/apk -name '*.apk' -exec cp {} "$RUNNER_TEMP/apk/" \;
          cd "$RUNNER_TEMP/apk"
          test -n "$(ls *.apk 2>/dev/null)" || { echo "nenhum APK gerado"; exit 1; }
          sha256sum *.apk > SHA256SUMS.txt
          VERSION=$(sed -n "s/^MARKETING_VERSION=//p" "$GITHUB_WORKSPACE/iosApp/Configuration/Version.xcconfig" | tr -d " ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          TAG="android-v${VERSION}-${GITHUB_SHA::7}"
          cd "$RUNNER_TEMP/apk"
          gh release create "$TAG" *.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "WATCHFIRST Android ${VERSION} (${GITHUB_REF_NAME})" \
            --notes "Build automático do WATCHFIRST para Android. Commit: ${GITHUB_SHA}. Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Cada APK traz o SHA-256 em SHA256SUMS.txt."
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
