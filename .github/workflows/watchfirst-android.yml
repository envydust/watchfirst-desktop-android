name: WATCHFIRST Android
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'release = APK assinado para membros; debug = APK de teste (instala ao lado, permite inspeção no emulador)'
        type: choice
        options: [release, debug]
        default: release
  push:
    branches: [main, splash-watchfirst]
    paths-ignore:
      - '**.md'
      # iPhone-only files build in watchfirst-ios.yml.
      - '.github/workflows/watchfirst-ios.yml'
      - 'scripts/build-ios-ipa.sh'
      - 'iosApp/**'
concurrency:
  group: watchfirst-android-${{ github.ref }}-${{ inputs.build_type || 'release' }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local configuration
        env:
          SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "NUVIO_ANDROID_DISTRIBUTION=full"
            echo "NUVIO_SUPABASE_URL=$SUPABASE_URL"
            echo "NUVIO_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "NUVIO_SUPABASE_FALLBACK_URL=$SUPABASE_FALLBACK_URL"
            echo "TMDB_API_KEY=$TMDB_API_KEY"
          } > local.properties
          if [ "$BUILD_TYPE" != "debug" ] && [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "NUVIO_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> local.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          if [ "$SIGNED" = "true" ]; then TASK=":androidApp:assembleFullRelease"; else TASK=":androidApp:assembleFullDebug"; fi
          # The hosted runner has 16 GB. gradle.properties asks for 12 GB (Gradle) + 8 GB (Kotlin daemon), and the
          # R8 step of the release build then gets killed (exit 143). Compile Kotlin inside Gradle with a 10 GB heap.
          MEMORY_FLAGS=(-Dorg.gradle.jvmargs="-Xmx10g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" -Pkotlin.compiler.execution.strategy=in-process)
          # Downloads from Maven/Gradle occasionally time out on hosted runners; retry the build, not the code.
          set +e
          for attempt in 1 2 3; do
            ./gradlew "$TASK" --no-daemon --stacktrace "${MEMORY_FLAGS[@]}" 2>&1 | tee "$RUNNER_TEMP/gradle-$attempt.log"
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && exit 0
            if grep -qE "^e: |Compilation error|Execution failed for task ':composeApp:compile" "$RUNNER_TEMP/gradle-$attempt.log"; then
              echo "Erro de compilação: sem nova tentativa."; exit "$status"
            fi
            echo "Tentativa $attempt falhou (provável rede). Repetindo em 30 s..."; sleep 30
          done
          exit 1

      - name: Collect APKs and checksums
        id: collect
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          find androidApp/build/outputs/apk -name '*.apk' -exec cp {} "$RUNNER_TEMP/apk/" \;
          cd "$RUNNER_TEMP/apk"
          test -n "$(ls *.apk 2>/dev/null)" || { echo "nenhum APK gerado"; exit 1; }
          sha256sum *.apk > SHA256SUMS.txt
          VERSION=$(sed -n "s/^MARKETING_VERSION=//p" "$GITHUB_WORKSPACE/iosApp/Configuration/Version.xcconfig" | tr -d " \r")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          if [ "$SIGNED" = "true" ]; then KIND=release; else KIND=debug; fi
          TAG="android-v${VERSION}-${GITHUB_SHA::7}-${KIND}-r${GITHUB_RUN_NUMBER}"
          cd "$RUNNER_TEMP/apk"
          gh release create "$TAG" *.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "WATCHFIRST Android ${VERSION} ${KIND} (${GITHUB_REF_NAME})" \
            --notes "Build automático do WATCHFIRST para Android (${KIND}). Para membros, use o APK universal; os demais são por tipo de processador (arm64-v8a serve na maioria dos celulares). Commit: ${GITHUB_SHA}. Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. SHA-256 de cada APK em SHA256SUMS.txt."
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
