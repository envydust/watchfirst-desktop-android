name: WATCHFIRST iPhone
# Unsigned IPA for sideloading (AltStore re-signs it with the member's own Apple ID).
on:
  workflow_dispatch:
  push:
    branches: [splash-watchfirst]
    paths:
      - '.github/workflows/watchfirst-ios.yml'
      - 'scripts/build-ios-ipa.sh'
      - 'iosApp/**'
concurrency:
  group: watchfirst-ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode 26 (the app uses iOS 26 APIs)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "Xcode 26 not installed on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Write local configuration
        env:
          SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          {
            echo "NUVIO_IOS_DISTRIBUTION=full"
            echo "NUVIO_SUPABASE_URL=$SUPABASE_URL"
            echo "NUVIO_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "NUVIO_SUPABASE_FALLBACK_URL=$SUPABASE_FALLBACK_URL"
            echo "TMDB_API_KEY=$TMDB_API_KEY"
          } > local.properties

      - name: Prepare iOS dependencies (MPVKit, Nuvio Engine)
        run: bash scripts/prepare-ios-dependencies.sh

      - name: Build unsigned IPA
        env:
          NUVIO_GRADLE_JVMARGS: -Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m
          NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx6g
        run: |
          set -o pipefail
          bash scripts/build-ios-ipa.sh 2>&1 | tee "$RUNNER_TEMP/ios-build.log" | grep -E "^(e:|error:|warning: \[|Created |\*\* )|BUILD (SUCCEEDED|FAILED)|Compiling|Linking" | tail -200

      - name: Show build errors
        if: failure()
        run: |
          grep -nE "error:|^e: |FAILED" "$RUNNER_TEMP/ios-build.log" | head -80 || true

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/ios-ipa
          ls -la
          shasum -a 256 *.ipa > SHA256SUMS.txt
          VERSION=$(sed -n "s/^MARKETING_VERSION=//p" "$GITHUB_WORKSPACE/iosApp/Configuration/Version.xcconfig" | tr -d " \r")
          TAG="ios-v${VERSION}-${GITHUB_SHA::7}-r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" *.ipa SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "WATCHFIRST iPhone ${VERSION} (${GITHUB_REF_NAME})" \
            --notes "IPA sem assinatura para instalar pelo AltStore (o AltStore assina com a conta Apple do membro). Commit: ${GITHUB_SHA}."
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
